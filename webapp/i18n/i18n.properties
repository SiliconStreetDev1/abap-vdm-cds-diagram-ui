# =======================================================
# --- INFO POPOVERS (EXPLANATIONS) ---
# =======================================================
infoTitleCdsName=CDS View Name Requirements
infoTextCdsName=Please enter the exact technical name of the CDS View. Automated search and value-help is available.

infoTitleEngine=Rendering Engine Explained
infoTextEngine=<strong>Cytoscape (Default):</strong> The primary interactive engine featuring physics-based layouts, node pinning, hiding, and drill-downs.<br/><br/><strong>Graphviz:</strong> Handles massive, complex data webs natively using WebAssembly.<br/><br/><strong>Mermaid:</strong> Great for clean, simple diagrams.<br/><br/><strong>PlantUML:</strong> Best for standard UML exports.

infoTitleLevels=Levels Explained
infoTextLevels=Controls how deep the crawler goes.<br/><br/><strong>Level 1:</strong> Shows the root entity.<br/><strong>Level 2:</strong> Fetches direct associations.<br/><strong>Level N:</strong> Continues recursively as deep as configured.<br/><br/><strong>Warning:</strong> High levels on complex architectures may take significant time to render.

infoTitleShowKeys=Show Keys Explained
infoTextShowKeys=Displays the primary key fields of the CDS views inside the diagram boxes.

infoTitleShowFields=Show All Fields Explained
infoTextShowFields=Displays every non-key field available in the CDS view.<br/><br/><strong>Warning:</strong> This can make the diagram incredibly large. Key field visibility is not controlled by this toggle (See Show Keys).

infoTitleShowAssocFields=Show Association Fields
infoTextShowAssocFields=Displays the association fields of the CDS views inside the diagram boxes.<br/><br/>If enabled, relationship lines will be drawn directly from the fields if requested.

infoTitleShowBase=Show Base Data Source
infoTextShowBase=Includes the underlying database tables or base CDS views that this view selects its data from.

infoTitleCustomOnly=Custom Dev Only
infoTextCustomOnly=Filters the diagram to only show custom-built entities (those starting with Z or Y). Standard SAP entities are hidden.

infoTitleRelMode=Relationship Mode
infoTextRelMode=<strong>Lines:</strong> Physically draw connections on the canvas.<br/><br/><strong>Discovery:</strong> Fetches the related entities into the diagram payload without drawing connecting lines, keeping large webs clean.

infoTitleInclude=Include Entities
infoTextInclude=Only the exact CDS views listed here will be processed. All others will be ignored.

infoTitleExclude=Exclude Entities
infoTextExclude=The exact CDS views listed here will be forcibly removed and hidden from the diagram.

infoTitleInteractionMode=Interaction Modes & Shortcuts
infoTextInteractionMode=<strong>Pan Mode:</strong> Left-Click and drag to move the canvas.<br/><br/><strong>Select Mode:</strong> Left-Click and drag to draw a selection box.<br/><br/><strong>Shortcuts:</strong><ul><li><strong>Scroll Wheel:</strong> Zoom</li><li><strong>V or S:</strong> Switch to Select Mode</li><li><strong>H or P:</strong> Switch to Pan Mode</li><li><strong>Hold Spacebar:</strong> Temporarily pan</li><li><strong>Hold Shift:</strong> Temporarily box-select</li><li><strong>Ctrl/Cmd + Click:</strong> Multi-select nodes</li><li><strong>Ctrl + A:</strong> Select All</li><li><strong>Delete / Backspace:</strong> Hide entities / Delete notes</li><li><strong>Shift + N:</strong> Add Note</li><li><strong>Shift + T:</strong> Temp Focus Mode</li><li><strong>Shift + H:</strong> Hidden Nodes Dialog</li><li><strong>Ctrl + Z:</strong> Undo Action</li></ul>

infoTitleVideoRecording=Video Recording Tool
infoTextVideoRecording=Enables the native browser screen recording tool to capture architectural interactions without external software.

infoTitleStealthMode=Stealth Mode Explained
infoTextStealthMode=Hides all visual recording indicators (buttons, timers, and countdowns) for silent captures.<br/><br/>Use the global hotkey <strong>Ctrl + Shift + X</strong> to instantly start and stop the recording.
